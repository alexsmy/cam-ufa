name: Надзор за обновлениями

# Страховка для самоподдерживающейся цепочки.
#
# Обычная цепочка ставит следующий «будильник» только после успешной
# публикации. Если запуск отменили или он упал до этого места, цепочка обрывается
# и сайт стоит до резервного cron (а он у GitHub часто опаздывает на часы).
#
# Этот workflow срабатывает на завершение ЛЮБОГО запуска обновления —
# успешного, упавшего или отменённого — и всё равно ставит будильник.
# Будильник сам выждет 6 минут и запустит обновление заново.

on:
  workflow_run:
    workflows: ["Обновление превью камер"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

# Два завершившихся запуска подряд не должны плодить будильники.
concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  restart:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ставим следующий запуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh workflow run ticker.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "Следующий запуск поставлен"
              exit 0
            fi
            echo "Попытка $i не удалась, повтор через 30 секунд"
            sleep 30
          done
          echo "Не удалось поставить следующий запуск" >&2
          exit 1
