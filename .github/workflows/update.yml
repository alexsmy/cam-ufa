name: Обновление превью камер

on:
  schedule:
    - cron: '7 * * * *'      # каждый час в :07
  workflow_dispatch:         # можно запустить вручную

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ставим ffmpeg (статический бинарник)
        run: |
          curl -L --retry 3 -o ./ffmpeg https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/linux-x64
          chmod +x ./ffmpeg
          echo "$PWD" >> $GITHUB_PATH

      - name: Обновляем index.html со свежими превью
        env:
          DEBUG: '1'
        run: python refresh.py

      - name: Коммитим результат (Pages сам обновится)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "preview $(date -u +%F-%H%M)"
            git push
          fi
