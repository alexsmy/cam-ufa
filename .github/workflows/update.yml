name: Обновление превью камер

on:
  push:
    branches: [main]        # любое изменение в main сразу публикуется
  schedule:
    # Резервное расписание. GitHub-cron не гарантирует запуск и часто его теряет,
    # поэтому основной механизм — цепочка update.yml -> ticker.yml (см. ниже).
    # Минуты 7 и 37 выбраны специально: на :00 и :30 у GitHub самая большая нагрузка.
    - cron: '7,37 * * * *'
  workflow_dispatch:          # можно запустить вручную

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write            # нужно, чтобы запускать ticker.yml

# один деплой за раз; не отменяем уже начатую публикацию
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Папка archive/ не хранится в git (она большая). Чтобы таймлапс за сутки
      # действительно накапливался, забираем предыдущую публикацию сайта и
      # переносим из неё архив кадров в текущую сборку.
      - name: Восстанавливаем архив кадров
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")]
                      | sort_by(.created_at)
                      | if length > 0 then .[-1].id else "" end')
          if [ -z "$id" ]; then
            echo "Прошлой публикации main нет — архив начнётся с этого запуска"
            exit 0
          fi
          echo "Берём артефакт $id"
          if ! curl -sSL --fail --retry 3 \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
               -o /tmp/pages.zip; then
            echo "::warning::Не удалось скачать прошлую публикацию — архив начнётся заново"
            exit 0
          fi
          rm -rf /tmp/prev && mkdir -p /tmp/prev
          unzip -q /tmp/pages.zip -d /tmp/prev
          # upload-pages-artifact кладёт сайт в один artifact.tar, а не файлами.
          if [ -f /tmp/prev/artifact.tar ]; then
            tar -xf /tmp/prev/artifact.tar -C /tmp/prev
          fi
          if [ -d /tmp/prev/archive ]; then
            rm -rf ./archive
            cp -r /tmp/prev/archive ./archive
            echo "Кадров восстановлено: $(find archive -name '*.webp' | wc -l)"
          else
            echo "В прошлой публикации архива не было — начинаем с этого запуска"
          fi

      - name: Ставим ffmpeg через pip
        run: python -m pip install -q -r requirements.txt

      - name: Скачиваем превью и собираем страницу
        run: python refresh.py

      - name: Готовим сайт к публикации
        run: |
          mkdir -p _site
          cp index.html icon.svg og.png watch.html _site/
          cp -r previews _site/
          cp -r archive _site/

      - name: Отчёт в лог
        run: |
          echo "Запуск (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')  событие: $GITHUB_EVENT_NAME"
          echo "Превью на сайте: $(ls previews | wc -l)"
          echo "MP4 таймлапсов: $(find archive -name 'timelapse.mp4' | wc -l)"
          python - <<'PY'
          import json
          m = json.load(open('archive/index.json', encoding='utf-8'))
          total = sum(len(v) for v in m.values())
          sample = next((v for v in m.values() if v), [])
          print(f'Кадров в архиве: {total}; у камеры {len(sample)}: {", ".join(sample[-3:])}')
          PY

      # GitHub отключает расписание, если в репозитории 60 дней нет активности.
      # Раз в неделю обновляем маленький файл, чтобы расписание не остановилось.
      - name: Поддерживаем расписание активным
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f last-run.txt ] || [ $(( ($(date +%s) - $(date -r last-run.txt +%s)) / 86400 )) -ge 7 ]; then
            date -u +%F > last-run.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last-run.txt
            git commit -m "keepalive $(date -u +%F)"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Самоподдержка ──────────────────────────────────────────────────────────
  # GitHub не гарантирует запуск по cron: за 18 часов расписание */30 не сработало
  # ни разу. Поэтому после каждого прогона сразу ставим «будильник» ticker.yml,
  # который через ~24 минуты запустит этот workflow заново.
  chain:
    needs: [deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ставим следующий запуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh workflow run ticker.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "Следующий запуск поставлен"
              exit 0
            fi
            echo "Попытка $i не удалась, повтор через 30 секунд"
            sleep 30
          done
          echo "Не удалось поставить следующий запуск" >&2
          exit 1
