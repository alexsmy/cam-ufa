name: Обновление превью камер

on:
  schedule:
    - cron: '7 * * * *'      # каждый час в :07
  workflow_dispatch:          # можно запустить вручную

permissions:
  contents: read
  pages: write
  id-token: write

# один деплой за раз; не отменяем уже начатую публикацию
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Ставим ffmpeg через pip
        run: python -m pip install -q -r requirements.txt

      - name: Скачиваем превью и собираем страницу
        run: python refresh.py

      - name: Готовим сайт к публикации
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r previews _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
