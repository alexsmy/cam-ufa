<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a58ca" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<title>Камеры строек Уфы</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="description" content="Камеры строек и ЖК Уфы: превью обновляются каждые 30 минут, таймлапс за сутки.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Камеры строек Уфы">
<meta property="og:title" content="Камеры строек Уфы">
<meta property="og:description" content="72 камеры строек и ЖК Уфы. Превью обновляются каждые 30 минут, таймлапс за сутки.">
<meta property="og:url" content="https://alexsmy.github.io/cam-ufa/">
<meta property="og:image" content="https://alexsmy.github.io/cam-ufa/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#eef2f7;--card:#fff;--tx:#1c2733;--mut:#6b7785;--acc:#0a58ca;
  --line:#dfe6ef;--chip:#e7f1ff;--chip-a:#cfe3ff;--off:#c0392b;
  --shadow:0 1px 4px rgba(16,32,56,.10);--radius:12px
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1419;--card:#171d25;--tx:#e6edf3;--mut:#93a1b0;--acc:#63a8ff;
        --line:#243040;--chip:#1d2b3f;--chip-a:#263a55;--off:#ff6b5e;
        --shadow:0 1px 4px rgba(0,0,0,.45)}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1800px;margin:0 auto;padding:0 10px}
/* ---------- шапка ---------- */
header{position:sticky;top:0;z-index:20;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px}
h1{font-size:17px;margin:0;white-space:nowrap}
.meta{font-size:12px;color:var(--mut);white-space:nowrap}
.tools{display:flex;gap:6px;flex:1;min-width:220px;justify-content:flex-end}
input[type=search]{flex:1;min-width:120px;max-width:340px;padding:8px 12px;border:1px solid var(--line);
  border-radius:999px;background:var(--card);color:var(--tx);font-size:14px;outline:none}
input[type=search]:focus{border-color:var(--acc)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);
  border-radius:999px;padding:8px 12px;font-size:14px;transition:background .15s,transform .1s}
button:hover{background:var(--chip)}
button:active{transform:scale(.97)}
button[aria-pressed=true]{background:var(--chip-a);border-color:var(--acc);color:var(--acc)}
/* ---------- секции ---------- */
.jk{background:var(--card);border-radius:var(--radius);padding:12px;margin:10px 0;box-shadow:var(--shadow)}
.jk h2{position:sticky;top:58px;z-index:5;margin:0 0 10px;padding:4px 0;font-size:16px;line-height:1.25;
  background:var(--card);display:flex;align-items:baseline;gap:8px}
.jk h2 .cnt{font-size:12px;font-weight:400;color:var(--mut)}
.cams{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:start}
@media(min-width:560px){.cams{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.cams{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1400px){.cams{grid-template-columns:repeat(4,1fr)}}
/* ---------- карточка ---------- */
.cam{position:relative;display:flex;flex-direction:column;background:var(--bg);border-radius:10px;overflow:hidden;
  transition:transform .15s,box-shadow .15s}
.cam:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(16,32,56,.18)}
.shot{position:relative;display:block;line-height:0}
.shot img{width:100%;height:auto;display:block;background:var(--line);border-radius:10px 10px 0 0}
.badge{position:absolute;left:8px;top:8px;font-size:11px;line-height:1;padding:5px 7px;border-radius:6px;
  background:var(--off);color:#fff;font-weight:600;letter-spacing:.2px}
.cap{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--chip);border-radius:0 0 10px 10px}
.cap .t{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--acc);text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .ts{font-size:11px;color:var(--mut);white-space:nowrap}
.star{border:0;background:none;padding:0 2px;font-size:17px;line-height:1;color:var(--mut)}
.star[aria-pressed=true]{color:#e8a317}
.tl-btn{border:0;background:none;padding:0 2px;font-size:14px;line-height:1;color:var(--mut)}
.tl-btn:hover{color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
/* ---------- окно таймлапса ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:flex;align-items:center;
  justify-content:center;padding:12px}
.modal-box{background:var(--card);border-radius:12px;max-width:960px;width:100%;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.5)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;font-size:15px}
.modal-hd strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-hd button{border:0;background:none;font-size:24px;line-height:1;padding:0 6px;color:var(--mut)}
.tl-stage{position:relative;background:#000;line-height:0;min-height:140px}
.tl-stage img{width:100%;height:auto;display:block}
.tl-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;background:rgba(0,0,0,.6);padding:20px;text-align:center}
.tl-ctl{display:flex;align-items:center;gap:10px;padding:10px 12px}
.tl-ctl input[type=range]{flex:1;accent-color:var(--acc)}
.tl-ctl .t{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:78px;text-align:right}
.tl-ctl #tl-mp4{flex:none;min-width:116px;height:34px;padding:0 12px;border-radius:8px;
  border:1px solid var(--acc);background:var(--acc);color:#fff;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.tl-ctl #tl-mp4[aria-disabled=true]{background:var(--chip);border-color:var(--line);
  color:var(--mut);pointer-events:none}
@media(max-width:559px){
  .tl-ctl{flex-wrap:wrap}
  .tl-ctl input[type=range]{min-width:140px}
  .tl-ctl .t{min-width:auto}
}
body.locked{overflow:hidden}
/* ---------- наверх ---------- */
#top{position:fixed;right:14px;bottom:14px;width:42px;height:42px;border-radius:50%;padding:0;
  font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#top.show{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ---------- телефон: 1 или 2 камеры в ряд ---------- */
#cols{display:none;width:34px;height:34px;padding:0;border-radius:50%;font-size:13px;font-weight:600;line-height:1}
@media(max-width:559px){
  #cols{display:inline-block}
  #fav .lbl{display:none}
  #fav{padding:8px 10px}
  input[type=search]{min-width:80px}
  html.one .cams{grid-template-columns:1fr}
  .jk{padding:8px}
  .cap{padding:6px 8px;gap:4px}
  .cap .t{font-size:13px}
  .cap .ts{display:none}
}
</style>
<script>try{if(localStorage.getItem('camufa-cols')==='1')document.documentElement.className='one'}catch(e){}</script>
</head>
<body>
<header>
  <div class="wrap hd">
    <div>
      <h1>Камеры строек Уфы</h1>
      <div class="meta" id="meta">{{COUNT}} камер · онлайн {{ONLINE}} · обновлено {{STAMP}} (Уфа)</div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Поиск по ЖК…" autocomplete="off" aria-label="Поиск по ЖК">
      <button id="fav" type="button" aria-pressed="false">★<span class="lbl"> Избранное</span></button>
      <button id="cols" type="button" title="Камер в ряд" aria-label="Камер в ряд: 2">2</button>
    </div>
  </div>
</header>
<main class="wrap" id="list">
{{SECTIONS}}
<p class="empty" id="empty" hidden>Ничего не найдено</p>
</main>
<button id="top" type="button" title="Наверх" aria-label="Наверх">↑</button>

<div class="modal" id="tl" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="tl-title">
    <div class="modal-hd">
      <strong id="tl-title">Таймлапс</strong>
      <button id="tl-close" type="button" aria-label="Закрыть">×</button>
    </div>
    <div class="tl-stage">
      <img id="tl-img" alt="">
      <div class="tl-msg" id="tl-msg">Загрузка кадров…</div>
    </div>
    <div class="tl-ctl">
      <button id="tl-play" type="button" aria-label="Пауза">⏸</button>
      <input id="tl-range" type="range" min="0" max="0" value="0" aria-label="Кадр">
      <span class="t" id="tl-time">—</span>
      <a id="tl-mp4" href="#" download aria-disabled="true" title="Скачать MP4, 5 кадров в секунду">Скачать MP4</a>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var BUILT = {{BUILT_MS}};
  var cards = [].slice.call(document.querySelectorAll('.cam'));
  var secs  = [].slice.call(document.querySelectorAll('.jk'));
  var q = document.getElementById('q');
  var favBtn = document.getElementById('fav');
  var empty = document.getElementById('empty');
  var top = document.getElementById('top');
  var FAV_KEY = 'camufa-fav';
  var favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch(e){}

  function saveFavs(){ try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favs))); } catch(e){} }

  cards.forEach(function(c){
    var b = c.querySelector('.star');
    if (!b) return;
    var on = favs.has(c.dataset.id);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.textContent = on ? '★' : '☆';
    b.addEventListener('click', function(ev){
      ev.preventDefault();
      var id = c.dataset.id;
      if (favs.has(id)) favs.delete(id); else favs.add(id);
      saveFavs();
      var now = favs.has(id);
      b.setAttribute('aria-pressed', now ? 'true' : 'false');
      b.textContent = now ? '★' : '☆';
      apply();
    });
  });

  var favOnly = false;
  function apply(){
    var term = (q.value || '').trim().toLowerCase();
    var visible = 0;
    cards.forEach(function(c){
      var ok = (!term || c.dataset.search.indexOf(term) >= 0) &&
               (!favOnly || favs.has(c.dataset.id));
      c.hidden = !ok;
      if (ok) visible++;
    });
    secs.forEach(function(s){
      s.hidden = !s.querySelector('.cam:not([hidden])');
    });
    empty.hidden = visible > 0;
  }
  q.addEventListener('input', apply);
  favBtn.addEventListener('click', function(){
    favOnly = !favOnly;
    favBtn.setAttribute('aria-pressed', favOnly ? 'true' : 'false');
    apply();
  });

  // 1 или 2 камеры в ряд на телефоне (кнопка показывает текущий режим)
  var colsBtn = document.getElementById('cols');
  function setCols(n){
    document.documentElement.classList.toggle('one', n === '1');
    colsBtn.textContent = n;
    colsBtn.setAttribute('aria-label', 'Камер в ряд: ' + n + '. Нажмите, чтобы переключить');
    try { localStorage.setItem('camufa-cols', n); } catch(e){}
  }
  colsBtn.addEventListener('click', function(){
    setCols(colsBtn.textContent === '1' ? '2' : '1');
  });
  try { setCols(localStorage.getItem('camufa-cols') === '1' ? '1' : '2'); } catch(e){ setCols('2'); }

  window.addEventListener('scroll', function(){
    top.classList.toggle('show', window.scrollY > 600);
  }, {passive:true});
  top.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });

  // «обновлено N мин назад»
  var meta = document.getElementById('meta');
  var base = meta.textContent;
  function tick(){
    var age = Date.now() - BUILT;
    var m = Math.floor(age / 60000);
    if (m >= 1) meta.textContent = base.replace(/обновлено .*? \(Уфа\)/,
      'обновлено ' + (m < 60 ? m + ' мин назад' : Math.floor(m/60) + ' ч назад'));
    var last = 0;
    try { last = +sessionStorage.getItem('camufa-reload') || 0; } catch(e){}
    if (age > 35 * 60000 && Date.now() - last > 10 * 60000) {
      try { sessionStorage.setItem('camufa-reload', String(Date.now())); } catch(e){}
      try { sessionStorage.setItem('camufa-return', '1'); } catch(e){}
      location.reload();
    }
  }
  setInterval(tick, 60000);

  // Позиция списка: сохраняем на каждом шаге прокрутки и возвращаем при
  // возврате с просмотра камеры или после авто-обновления.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  function saveY(){
    try { sessionStorage.setItem('camufa-y', Math.round(window.scrollY) + '|' + Date.now()); } catch(e){}
  }
  var saveTick = 0;
  window.addEventListener('scroll', function(){
    if (saveTick) return;
    saveTick = setTimeout(function(){ saveTick = 0; saveY(); }, 200);
  }, {passive:true});
  window.addEventListener('pagehide', saveY);
  window.addEventListener('beforeunload', saveY);

  function restoreY(){
    var raw = '', y = 0, ts = 0, flag = false;
    try {
      raw = sessionStorage.getItem('camufa-y') || '';
      flag = sessionStorage.getItem('camufa-return') === '1';
    } catch(e){}
    var parts = raw.split('|');
    y = +parts[0] || 0;
    ts = +parts[1] || 0;
    // флаг ставит камера перед возвратом и авто-обновление;
    // свежая отметка подстраховывает ручную перезагрузку
    var recent = ts > 0 && Date.now() - ts < 2 * 60000;
    if (y <= 0 || (!flag && !recent)) return;
    try {
      sessionStorage.removeItem('camufa-y');
      sessionStorage.removeItem('camufa-return');
    } catch(e){}
    var smooth = document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior = 'auto';
    window.scrollTo(0, y);
    document.documentElement.style.scrollBehavior = smooth;
    // на случай, если картинки ещё изменили высоту
    requestAnimationFrame(function(){ window.scrollTo(0, y); });
  }
  restoreY();
  window.addEventListener('pageshow', function(e){ if (e.persisted) restoreY(); });

  // ---------- таймлапс за сутки ----------
  var ARCH_V = '{{ARCH_V}}';
  var tlEl = document.getElementById('tl');
  var tlImg = document.getElementById('tl-img');
  var tlMsg = document.getElementById('tl-msg');
  var tlTitle = document.getElementById('tl-title');
  var tlRange = document.getElementById('tl-range');
  var tlTime = document.getElementById('tl-time');
  var tlPlay = document.getElementById('tl-play');
  var tlMp4 = document.getElementById('tl-mp4');
  var frames = [], idx = 0, timer = null, manifest = null, tlId = '';

  function frameUrl(id, name){ return 'archive/' + id + '/' + name; }
  function label(name){ return name.slice(8, 10) + ':' + name.slice(10, 12); }

  function setDownload(enabled){
    if (enabled) {
      tlMp4.href = 'archive/' + tlId + '/timelapse.mp4?v=' + ARCH_V;
      tlMp4.setAttribute('aria-disabled', 'false');
    } else {
      tlMp4.removeAttribute('href');
      tlMp4.setAttribute('aria-disabled', 'true');
    }
  }

  function show(i){
    idx = i;
    tlImg.src = frames[i].url;
    tlRange.value = i;
    tlTime.textContent = label(frames[i].name);
  }
  function play(){
    stop();
    tlPlay.textContent = '⏸';
    timer = setInterval(function(){ show((idx + 1) % frames.length); }, 250);
  }
  function stop(){
    if (timer) { clearInterval(timer); timer = null; }
    tlPlay.textContent = '▶';
  }
  function close(){
    stop();
    tlEl.hidden = true;
    document.body.classList.remove('locked');
  }

  function openTL(id, name){
    tlId = id;
    tlTitle.textContent = name + ' — таймлапс за сутки';
    tlEl.hidden = false;
    document.body.classList.add('locked');
    tlImg.removeAttribute('src');
    tlMsg.hidden = false;
    tlMsg.textContent = 'Загрузка кадров…';
    frames = [];
    setDownload(false);
    if (!manifest) {
      manifest = Promise.all([
        fetch('archive/index.json?v=' + ARCH_V)
          .then(function(r){ return r.ok ? r.json() : {}; })
          .catch(function(){ return {}; }),
        fetch('archive/videos.json?v=' + ARCH_V)
          .then(function(r){ return r.ok ? r.json() : []; })
          .catch(function(){ return []; })
      ]).then(function(a){ return {list: a[0], vids: a[1]}; });
    }
    manifest.then(function(m){
      var list = m.list[id] || [];
      if (list.length < 2) {
        tlMsg.textContent = 'Кадры ещё накапливаются — загляните через час.';
        return;
      }
      frames = list.map(function(n){ return {name:n, url: frameUrl(id, n)}; });
      setDownload((m.vids || []).indexOf(id) >= 0);
      var loaded = 0;
      frames.forEach(function(f){
        var im = new Image();
        im.onload = im.onerror = function(){
          if (++loaded === 1) { tlMsg.hidden = true; show(frames.length - 1); play(); }
        };
        im.src = f.url;
      });
      tlRange.max = frames.length - 1;
      tlRange.value = frames.length - 1;
      tlTime.textContent = label(frames[frames.length - 1].name);
    });
  }

  cards.forEach(function(c){
    var b = c.querySelector('.tl-btn');
    if (!b) return;
    b.addEventListener('click', function(ev){
      ev.preventDefault();
      openTL(c.dataset.id, b.dataset.name || '');
    });
  });
  document.getElementById('tl-close').addEventListener('click', close);
  tlEl.addEventListener('click', function(e){ if (e.target === tlEl) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !tlEl.hidden) close(); });
  tlPlay.addEventListener('click', function(){ timer ? stop() : play(); });
  tlRange.addEventListener('input', function(){ stop(); show(+tlRange.value); });
})();
</script>
</body>
</html>
