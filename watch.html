<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f14">
<title>Камера</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;flex-direction:column;color:#e6edf3;
  font:16px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#bar{position:relative;z-index:20;flex:none;display:flex;align-items:center;gap:4px;
  height:calc(54px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
  background:#0b0f14;border-bottom:1px solid #1e2733}
#bar .btn{position:relative;flex:none;display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#e6edf3;
  font:inherit;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#bar .btn:active{background:#1c2530}
#bar .btn.on{background:#17345c;color:#a8ceff}
#bar .btn svg{display:block;width:22px;height:22px}
#zlvl{position:absolute;right:2px;bottom:3px;font-size:10px;font-weight:700;line-height:1;
  background:#0b0f14;border-radius:4px;padding:2px 3px;color:#a8ceff}
#ttl{flex:1;min-width:0;padding:0 4px;text-align:center;font-size:15px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;background:#000}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;
  transform-origin:0 0;will-change:transform}
#grab{position:absolute;inset:0;z-index:2;display:none;pointer-events:none;touch-action:none}
body.zoom #grab{display:block;pointer-events:auto}
#hint{position:fixed;left:50%;transform:translateX(-50%);z-index:15;
  bottom:calc(16px + env(safe-area-inset-bottom));max-width:calc(100% - 24px);
  padding:8px 12px;border-radius:999px;background:rgba(12,18,26,.88);color:#dceaff;
  font-size:12px;line-height:1.3;text-align:center;opacity:0;transition:opacity .25s;
  pointer-events:none}
#hint.show{opacity:1}
@media(min-width:700px){
  #bar{padding-left:14px;padding-right:14px}
  #hint{font-size:13px}
}
</style>
</head>
<body>
<header id="bar">
  <button id="close" class="btn" type="button" aria-label="Назад к списку камер">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="ttl">Камера</div>
  <button id="zoom" class="btn" type="button" aria-pressed="false" aria-label="Приблизить">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none"
      stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5M11 8v6M8 11h6"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span id="zlvl" hidden></span>
  </button>
  <a id="direct" class="btn" href="#" target="_blank" rel="noopener noreferrer"
     aria-label="Открыть оригинал в новой вкладке" title="Оригинал">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h10v10M18 6L6 18" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</header>
<main id="stage">
  <iframe id="frame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen
          title="Видеотрансляция"></iframe>
  <div id="grab" aria-hidden="true"></div>
</main>
<div id="hint">Двумя пальцами — масштаб, одним — сдвиг, дважды — вернуть</div>
<script>
(function(){
  "use strict";
  var id = (new URLSearchParams(location.search)).get('id') || '';
  var name = (new URLSearchParams(location.search)).get('name') || '';
  var src = 'https://ucams.ufanet.ru/api/internal/embed/' + encodeURIComponent(id) +
            '/?ttl=3600&autoplay=true&mute=true';
  var frame = document.getElementById('frame');
  var grab  = document.getElementById('grab');
  var stage = document.getElementById('stage');
  var hint  = document.getElementById('hint');
  var zoomBtn = document.getElementById('zoom');
  var zlvl = document.getElementById('zlvl');

  frame.src = src;
  document.getElementById('direct').href = src;
  if (name) {
    document.getElementById('ttl').textContent = name;
    document.title = name + ' — камера';
  }

  // Метка «мы уходили на камеру» — список по ней восстановит прокрутку.
  function markReturn(){ try { sessionStorage.setItem('camufa-return', '1'); } catch(e){} }
  window.addEventListener('pagehide', markReturn);
  window.addEventListener('beforeunload', markReturn);
  document.getElementById('close').addEventListener('click', function(){
    markReturn();
    var same = false;
    try { same = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch(e){}
    if (same && history.length > 1) history.back();
    else location.replace('index.html');
  });

  // --- Масштаб ---
  // В обычном режиме над плеером ничего нет: все касания идут в плеер Уфанета.
  // Кнопка лупы включает режим приближения, где работают пинч и перетаскивание.
  var k = 1, x = 0, y = 0, MAX = 4;
  var LEVELS = [1, 2, 3, 4];
  var pts = new Map();
  var startDist = 1, startK = 1, startX = 0, startY = 0, startMid = null;
  var moved = false, downTime = 0, lastTap = 0, lastX = 0, lastY = 0;

  function rel(e){
    var r = stage.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  }
  function clamp(){
    var w = stage.clientWidth, h = stage.clientHeight;
    var minX = w * (1 - k), minY = h * (1 - k);
    if (x > 0) x = 0;
    if (x < minX) x = minX;
    if (y > 0) y = 0;
    if (y < minY) y = minY;
  }
  function updateUI(){
    var on = k > 1;
    document.body.classList.toggle('zoom', on);
    zoomBtn.classList.toggle('on', on);
    zoomBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    zoomBtn.setAttribute('aria-label', on ? ('Масштаб ×' + k + '. Нажмите, чтобы изменить') : 'Приблизить');
    zlvl.hidden = !on;
    zlvl.textContent = on ? ('×' + k) : '';
  }
  function apply(){
    clamp();
    frame.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')';
    updateUI();
  }
  function zoomAt(factor, cx, cy){
    var nk = Math.min(MAX, Math.max(1, k * factor));
    if (nk === k) return;
    var px = (cx - x) / k, py = (cy - y) / k;
    k = nk;
    x = cx - px * k;
    y = cy - py * k;
    if (k === 1) { x = 0; y = 0; }
    apply();
    if (k > 1) {
      showHint();
    } else {
      clearTimeout(showHint.t);
      hint.classList.remove('show');
    }
  }
  function setLevel(nk, cx, cy){ zoomAt(nk / k, cx, cy); }
  function showHint(){
    hint.classList.add('show');
    clearTimeout(showHint.t);
    showHint.t = setTimeout(function(){ hint.classList.remove('show'); }, 3200);
  }
  zoomBtn.addEventListener('click', function(){
    var i = LEVELS.indexOf(k);
    if (i < 0) i = 0;
    var nk = LEVELS[(i + 1) % LEVELS.length];
    setLevel(nk, stage.clientWidth / 2, stage.clientHeight / 2);
  });

  function mid(){
    var a = Array.from(pts.values());
    return {x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2};
  }
  function dist(){
    var a = Array.from(pts.values());
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
  }
  grab.addEventListener('pointerdown', function(e){
    grab.setPointerCapture(e.pointerId);
    var p = rel(e);
    pts.set(e.pointerId, p);
    moved = false;
    downTime = Date.now();
    if (pts.size === 1) { startX = x; startY = y; startMid = p; }
    if (pts.size === 2) {
      startDist = dist(); startK = k; startMid = mid(); startX = x; startY = y;
    }
  });
  grab.addEventListener('pointermove', function(e){
    if (!pts.has(e.pointerId)) return;
    var p = rel(e);
    pts.set(e.pointerId, p);
    if (Math.abs(p.x - startMid.x) + Math.abs(p.y - startMid.y) > 8) moved = true;
    if (pts.size === 1) {
      x = startX + (p.x - startMid.x);
      y = startY + (p.y - startMid.y);
      apply();
    } else if (pts.size === 2) {
      var m = mid(), d = dist();
      var nk = Math.min(MAX, Math.max(1, startK * d / startDist));
      var px = (startMid.x - startX) / startK, py = (startMid.y - startY) / startK;
      k = nk;
      x = m.x - px * k;
      y = m.y - py * k;
      apply();
    }
  });
  function up(e){
    var was = pts.size;
    var p = rel(e);
    pts.delete(e.pointerId);
    if (was === 1 && !moved && Date.now() - downTime < 350) {
      var now = Date.now();
      if (now - lastTap < 340 && Math.hypot(p.x - lastX, p.y - lastY) < 30) {
        setLevel(k > 1 ? 1 : 2, p.x, p.y);
        lastTap = 0;
      } else {
        lastTap = now; lastX = p.x; lastY = p.y;
      }
    }
    if (pts.size === 1) {
      var a = Array.from(pts.values())[0];
      startX = x; startY = y; startMid = a; moved = false;
    }
  }
  grab.addEventListener('pointerup', up);
  grab.addEventListener('pointercancel', up);
  window.addEventListener('resize', function(){ clamp(); apply(); });
  apply();
})();
</script>
</body>
</html>
