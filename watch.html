<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f14">
<title>Камера</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;flex-direction:column;color:#e6edf3;
  font:16px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#bar{flex:none;display:flex;align-items:center;gap:6px;
  height:calc(54px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
  background:#0b0f14;border-bottom:1px solid #1e2733}
#bar .btn{flex:none;display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#e6edf3;
  font:inherit;font-size:24px;line-height:1;text-decoration:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
#bar .btn:active{background:#1c2530}
#bar .btn svg{display:block;width:22px;height:22px}
#ttl{flex:1;min-width:0;padding:0 4px;text-align:center;font-size:15px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;position:relative;min-height:0;background:#000}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<header id="bar">
  <button id="close" class="btn" type="button" aria-label="Назад к списку камер">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="ttl">Камера</div>
  <a id="direct" class="btn" href="#" target="_blank" rel="noopener noreferrer"
     aria-label="Открыть оригинал в новой вкладке" title="Оригинал">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h10v10M18 6L6 18" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</header>
<main id="stage">
  <iframe id="frame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen
          title="Видеотрансляция"></iframe>
</main>
<script>
(function(){
  "use strict";
  var id = (new URLSearchParams(location.search)).get('id') || '';
  var name = (new URLSearchParams(location.search)).get('name') || '';
  var src = 'https://ucams.ufanet.ru/api/internal/embed/' + encodeURIComponent(id) +
            '/?ttl=3600&autoplay=true&mute=true';
  var frame = document.getElementById('frame');
  var ttl = document.getElementById('ttl');

  frame.src = src;
  document.getElementById('direct').href = src;
  if (name) {
    ttl.textContent = name;
    document.title = name + ' — камера';
  }

  // Возвращаемся в тот же список и на то же место. Список сам восстановит
  // прокрутку (см. index.html), поэтому здесь достаточно вернуться назад.
  document.getElementById('close').addEventListener('click', function(){
    var same = false;
    try { same = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch(e){}
    if (same && history.length > 1) history.back();
    else location.replace('index.html');
  });
})();
</script>
</body>
</html>
